<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">TeddyPups U.A.E. — Front-End Reconstruction</title>
  <desc id="d">A warm banner with paw prints, the TeddyPups title and a plane flying along a dotted route.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF1DC"/>
      <stop offset="0.55" stop-color="#FFD9A8"/>
      <stop offset="1" stop-color="#F7A55E"/>
    </linearGradient>
    <g id="paw">
      <ellipse cx="0" cy="14" rx="19" ry="16"/>
      <ellipse cx="-24" cy="-12" rx="8" ry="11" transform="rotate(-22 -24 -12)"/>
      <ellipse cx="-8" cy="-26" rx="8" ry="11" transform="rotate(-6 -8 -26)"/>
      <ellipse cx="9" cy="-26" rx="8" ry="11" transform="rotate(6 9 -26)"/>
      <ellipse cx="25" cy="-12" rx="8" ry="11" transform="rotate(22 25 -12)"/>
    </g>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>

  <!-- soft paw-print pattern -->
  <g fill="#7A3E12" opacity="0.07">
    <use href="#paw" transform="translate(90 70) rotate(-20) scale(1.3)"/>
    <use href="#paw" transform="translate(210 250) rotate(14) scale(1)"/>
    <use href="#paw" transform="translate(1090 80) rotate(18) scale(1.4)"/>
    <use href="#paw" transform="translate(980 255) rotate(-12) scale(1.1)"/>
    <use href="#paw" transform="translate(620 285) rotate(8) scale(0.8)"/>
  </g>

  <!-- dotted flight route + plane -->
  <path d="M60 262 C 300 190, 480 300, 700 214 S 1040 150, 1150 188" fill="none" stroke="#7A3E12" stroke-opacity="0.45" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 12"/>
  <g transform="translate(1004 160) rotate(-8)" fill="#7A3E12">
    <path d="M0 0 L46 8 L0 16 L8 8 Z"/>
    <path d="M14 8 L30 -14 L36 -12 L28 8 Z"/>
    <path d="M14 8 L30 30 L36 28 L28 8 Z"/>
  </g>

  <!-- main paw badge -->
  <g transform="translate(168 150)">
    <circle r="78" fill="#7A3E12"/>
    <g fill="#FFF1DC" transform="scale(1.15) translate(0 4)">
      <use href="#paw"/>
    </g>
  </g>

  <!-- title -->
  <text x="290" y="140" font-family="Georgia, 'Times New Roman', serif" font-size="78" font-weight="700" fill="#4A2208">TeddyPups</text>
  <text x="294" y="188" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-style="italic" fill="#7A3E12">U.A.E. · Front-End Reconstruction</text>
  <text x="294" y="238" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#4A2208" opacity="0.85">React 19  ·  TypeScript  ·  Vite  ·  zero animation libraries</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>